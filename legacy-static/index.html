<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Allo • Ask Merlin</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar__header">
          <div class="brand">
            <span class="brand__mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="20" height="20">
                <path
                  d="M4 18V6m0 12h16M8 14V8m4 6V5m4 9V9"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="brand__name">Allo</span>
          </div>
          <div class="sidebar__icons" aria-hidden="true">
            <button class="iconBtn" title="Theme">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <button class="iconBtn" title="Shortcuts">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M6 5h12M6 12h12M6 19h12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>
        </div>

        <button id="newChatBtn" class="newChat">
          <span class="newChat__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                d="M4 6h16v10H7l-3 3V6Z"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linejoin="round"
              />
              <path
                d="M12 8v6M9 11h6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
              />
            </svg>
          </span>
          New Chat
        </button>

        <nav class="nav">
          <a class="nav__item" href="#">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M12 3l1.6 5.1L19 10l-5.4 1.9L12 17l-1.6-5.1L5 10l5.4-1.9L12 3Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            Alpha
          </a>

          <a class="nav__item" href="#">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M7 9a5 5 0 0 1 10 0v3a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4V9Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <path
                  d="M9 18v2h6v-2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            Agents
            <span class="pill">SOON</span>
          </a>

          <button id="historyToggle" class="nav__item nav__item--button" type="button">
            <span class="nav__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M12 8v5l3 2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M6.4 6.4A8 8 0 1 1 4 12"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
                <path
                  d="M4 8V4h4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            History
            <span class="chev" aria-hidden="true">▾</span>
          </button>

          <div id="historyList" class="history">
            <button class="history__item" type="button">whats going on with cop...</button>
            <button class="history__item" type="button">BTC analysis today</button>
            <button class="history__item" type="button">ETH price prediction</button>
          </div>
        </nav>

        <div class="sidebar__footer">
          <div class="profile">
            <div class="avatar" aria-hidden="true">FR</div>
            <div class="profile__meta">
              <div class="profile__name">far_raven</div>
              <div class="profile__tag">INSIDER</div>
            </div>
          </div>
          <div class="footerBtns">
            <button class="ghostBtn" type="button">Join Community</button>
            <button class="squareBtn" type="button" aria-label="Twitter">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M20 7.3c-.6.3-1.3.5-2 .6.7-.4 1.2-1.1 1.5-1.9-.7.4-1.4.7-2.2.9A3.4 3.4 0 0 0 11.4 8a9.6 9.6 0 0 1-7-3.6 3.4 3.4 0 0 0 1.1 4.5c-.5 0-1-.2-1.5-.4v.1c0 1.6 1.2 3 2.8 3.3-.4.1-.9.1-1.3 0 .4 1.4 1.7 2.4 3.2 2.4A6.8 6.8 0 0 1 4 16.7 9.6 9.6 0 0 0 18.9 8c0-.2 0-.5 0-.7.7-.5 1.2-1 1.6-1.7Z"
                  fill="currentColor"
                />
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar__spacer"></div>
          <button class="shareBtn" type="button">
            <span class="shareBtn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M16 6a2 2 0 1 0-1.8-2.8L8.8 7.7a2 2 0 0 0 0 2.6l5.4 4.5A2 2 0 1 0 15 16.6l-5.4-4.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            Share
          </button>
        </header>

        <section class="content">
          <div id="emptyState" class="empty">
            <div class="empty__hero">
              <div class="botMark" aria-hidden="true">
                <svg viewBox="0 0 28 28" width="28" height="28">
                  <path
                    d="M14 3v3M8 9h12a3 3 0 0 1 3 3v7a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3v-7a3 3 0 0 1 3-3Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                  />
                  <path
                    d="M10.5 15h.01M17.5 15h.01"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linecap="round"
                  />
                </svg>
              </div>
              <h1 class="empty__title">ASK&nbsp;&nbsp;MERLIN</h1>
            </div>

            <div class="prompts">
              <button id="refreshBtn" class="refresh" type="button">
                <span class="refresh__icon" aria-hidden="true">⟳</span>
                Refresh
              </button>

              <div class="promptGrid">
                <button class="promptCard" type="button">• whats going on with copper</button>
                <button class="promptCard" type="button">• what about GDXU</button>
                <button class="promptCard" type="button">• rsi is quite low so will it bounce back or not</button>
                <button class="promptCard" type="button">• what about URAA</button>
                <button class="promptCard" type="button">• what about copper - compare all of them in table format</button>
                <button class="promptCard" type="button">• add in palladium and uuuu</button>
              </div>
            </div>
          </div>

          <div id="thread" class="thread" aria-live="polite"></div>
        </section>

        <footer class="composer">
          <div class="composer__inner">
            <button class="clipBtn" type="button" aria-label="Attach">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M8 12.5 14.8 5.7a3 3 0 0 1 4.2 4.2L11 18a5 5 0 0 1-7.1-7.1L12 2.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
            <input
              id="promptInput"
              class="composer__input"
              type="text"
              placeholder="Ask about crypto, DeFi, markets..."
              autocomplete="off"
            />
            <button id="sendBtn" class="sendBtn" type="button" aria-label="Send">
              <svg viewBox="0 0 24 24" width="18" height="18">
                <path
                  d="M12 5v14M12 5l-6 6M12 5l6 6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
        </footer>
      </main>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
